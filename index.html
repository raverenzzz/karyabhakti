<head>
    <meta charset="UTF-8">

    <title>Dokumentasi Karya Bhakti</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
      font-family:'Poppins',sans-serif;
      color:#fff;
      background:
        linear-gradient(135deg,
          #0f172a 0%,
          #312e81 30%,
          #7c3aed 55%,
          #0ea5e9 78%,
          #0f172a 100%);
      background-size:300% 300%;
      animation:gradientMove 14s ease infinite;
      overflow-x:hidden;
    }

    @keyframes gradientMove{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
body:before,body:after{
    content:"";position:fixed;border-radius:50%;z-index:-1;
    filter:blur(5px);pointer-events:none;
}
body:before{width:280px;height:280px;left:-100px;top:20%;background:#24a8ff22}
body:after{width:330px;height:330px;right:-120px;bottom:5%;background:#c23cff22}

.card{
    width:min(100%,500px); padding:38px 30px;
    position:relative; overflow:hidden;
    text-align:center; border-radius:34px;
    background:linear-gradient(145deg,#ffffff2b,#ffffff0d);
    border:1px solid #ffffff42;
    box-shadow:0 30px 80px #00000055,inset 0 1px #ffffff55;
    backdrop-filter:blur(28px) saturate(150%);
    -webkit-backdrop-filter:blur(28px) saturate(150%);
}
.card:before{
    content:"";position:absolute;left:8%;right:8%;top:0;height:1px;
    background:linear-gradient(90deg,transparent,#fff,transparent);
    opacity:.6;
}
.profile-img-container{
    width:105px;height:105px;margin:0 auto 18px;padding:4px;
    border-radius:50%;background:#ffffff25;
    border:1px solid #ffffff55;
    box-shadow:0 12px 40px #00000040,inset 0 1px #ffffff66;
}
.profile-img-container img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.social-media{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.social-icon{
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;color:#fff;text-decoration:none;
    background:#ffffff12;border:1px solid #ffffff35;
    box-shadow:inset 0 1px #ffffff30,0 8px 20px #0002;
    backdrop-filter:blur(12px);transition:.25s ease;
}
.social-icon:hover{transform:translateY(-4px) scale(1.08);background:#ffffff2b;border-color:#ffffff70}
h1{
    font-size:clamp(1.5rem,6vw,2rem);letter-spacing:.5px;margin-bottom:7px;
    text-shadow:0 3px 18px #0005;
}
p{font-size:.95rem;color:#ffffffc7;line-height:1.7;margin-bottom:25px}
.btn-group{display:flex;flex-direction:column;gap:13px}
.btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:54px;padding:14px 20px;
    border-radius:18px;text-decoration:none;color:#fff;
    font-size:.96rem;font-weight:650;letter-spacing:.1px;
    background:linear-gradient(135deg,#ffffff25,#ffffff0d);
    border:1px solid #ffffff38;
    box-shadow:0 10px 25px #0002,inset 0 1px #ffffff35;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    transition:.25s ease;
}
.btn:hover{
    transform:translateY(-4px);
    background:linear-gradient(135deg,#ffffff3b,#ffffff17);
    border-color:#ffffff75;
    box-shadow:0 16px 35px #0004,inset 0 1px #ffffff55;
}
.btn:active{transform:translateY(-1px)}
.btn i{font-size:1.05rem}
.btn-outline{color:#fff;background:#ffffff0f}
footer{margin-top:27px;color:#ffffff91;font-size:.78rem}
#output{color:#ffffff91!important;padding:8px!important}
@media(max-width:480px){
    body{padding:14px}
    .card{padding:30px 18px;border-radius:28px}
    .profile-img-container{width:90px;height:90px}
    .btn{min-height:52px}
}

/* ===== EFEK TOMBOL PREMIUM ===== */
.btn{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    transform:translateZ(0);
    transition:
        transform .28s cubic-bezier(.2,.8,.2,1),
        box-shadow .28s ease,
        border-color .28s ease,
        background .28s ease;
}

/* Kilauan yang menyapu tombol */
.btn::before{
    content:"";
    position:absolute;
    top:-40%;
    left:-90%;
    width:55%;
    height:180%;
    z-index:-1;
    transform:rotate(22deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.38),
        transparent
    );
    transition:left .65s ease;
}

.btn:hover::before{
    left:135%;
}

/* Cahaya lembut di tepi tombol */
.btn::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(
        120deg,
        rgba(255,255,255,.18),
        transparent 35%,
        transparent 65%,
        rgba(120,210,255,.14)
    );
    opacity:.45;
    transition:opacity .3s ease;
}

.btn:hover{
    transform:translateY(-5px) scale(1.015);
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.30),
        rgba(255,255,255,.10)
    );
    border-color:rgba(255,255,255,.75);
    box-shadow:
        0 18px 38px rgba(0,0,0,.30),
        0 0 24px rgba(120,200,255,.16),
        inset 0 1px rgba(255,255,255,.65);
}

.btn:hover::after{
    opacity:.9;
}

.btn:active{
    transform:translateY(-1px) scale(.985);
    box-shadow:
        0 7px 18px rgba(0,0,0,.25),
        inset 0 2px 8px rgba(0,0,0,.15);
}

/* Ikon ikut bergerak saat hover */
.btn i{
    position:relative;
    z-index:2;
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
}

.btn:hover i{
    transform:scale(1.18) rotate(-5deg);
}

/* Efek khusus tombol Google Drive */
.btn-outline{
    cursor:pointer;
}

/* Fokus keyboard tetap terlihat */
.btn:focus-visible{
    outline:2px solid rgba(255,255,255,.9);
    outline-offset:4px;
}

/* Animasi muncul berurutan */
.btn-group .btn{
    animation:buttonIn .65s both;
}

.btn-group .btn:nth-child(1){animation-delay:.10s}
.btn-group .btn:nth-child(2){animation-delay:.20s}
.btn-group .btn:nth-child(3){animation-delay:.30s}

@keyframes buttonIn{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

  <script>
// https://stackoverflow.com/questions/901115/how-can-i-get-query-string-values-in-javascript
var urlParams;
(function () {
    var match,
        pl     = /\+/g,  // Regex for replacing addition symbol with a space
        search = /([^&=]+)=?([^&]*)/g,
        decode = function (s) { return decodeURIComponent(s.replace(pl, " ")); },
        query  = window.location.search.substring(1);
    urlParams = {};
    while (match = search.exec(query))
       urlParams[decode(match[1])] = decode(match[2]);
})();
var output = document.getElementById("output");
if (urlParams["style"]) output.setAttribute("style", urlParams["style"]);
if (urlParams["bodyStyle"]) document.body.setAttribute("style", urlParams["bodyStyle"]);
var c;
setInterval(
c = function() {
	output.innerText = moment().format(urlParams["format"] || 'DD/MM/YYYY HH:mm:ss');

}, 1000);
